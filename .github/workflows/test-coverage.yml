name: Test Coverage

on:
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install root dependencies
        run: bun install

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install

      - name: Frontend — test with coverage
        run: bun run test:front:coverage

      # The binary is gitignored and downloaded per machine, so without this the
      # integration suites skip themselves and CI reports green on hooks nobody
      # actually exercised. Keep PB_VERSION in step with the Dockerfile.
      - name: Backend — fetch PocketBase for integration tests
        env:
          PB_VERSION: 0.25.9
        working-directory: apps/backend
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pb.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o -q /tmp/pb.zip pocketbase -d .
          chmod +x ./pocketbase
          ./pocketbase --version

      - name: Backend — test with coverage
        run: bun run test:back:coverage
